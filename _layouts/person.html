---
layout: default
---
<article class="wrap page person">
  <header class="page-header person-header">
    {% if page.photo and page.photo.size > 0 %}
    <img src="{{ page.photo | relative_url }}" alt="Photo of {{ page.title }}" class="person-photo">
    {% endif %}
    <div>
      <h1>{{ page.title }}</h1>
      {% if page.role %}<p class="page-subtitle">{{ page.role }}</p>{% endif %}
      {% if page.orcid %}<p><a href="https://orcid.org/{{ page.orcid }}" target="_blank" rel="noopener">ORCID: {{ page.orcid }}</a></p>{% endif %}
    </div>
  </header>
  <div class="page-content">
    {{ content }}
  </div>
  <p class="back-link"><a href="{{ '/people/' | relative_url }}">&larr; Back to People</a></p>
</article>
