---
layout: default
---
<article class="wrap page">
  <header class="page-header{% if page.hero_image %} page-header--mark{% endif %}">
    {% if page.hero_image %}
    <img src="{{ page.hero_image | relative_url }}" alt="{{ page.hero_image_alt | default: page.title }}" class="page-hero-mark">
    <h1 class="sr-only">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
    {% else %}
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
    {% endif %}
  </header>
  <div class="page-content">
    {{ content }}
  </div>
</article>
