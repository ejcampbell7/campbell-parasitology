<header class="site-header">
  <div class="wrap header-inner">
    <a class="site-brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/logo.svg' | relative_url }}" alt="" class="brand-mark" width="36" height="36">
      <span class="brand-text">
        <span class="brand-title">{{ site.short_title | default: site.title }}</span>
        <span class="brand-sub">{{ site.institution }}</span>
      </span>
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" id="nav-toggle">
      <span class="sr-only">Menu</span>
      <span class="hamburger"></span>
    </button>
    <nav class="site-nav" id="site-nav">
      <ul>
        {% for item in site.nav %}
        <li><a href="{{ item.url | relative_url }}" {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
<script>
  document.getElementById('nav-toggle').addEventListener('click', function () {
    var nav = document.getElementById('site-nav');
    var expanded = this.getAttribute('aria-expanded') === 'true';
    this.setAttribute('aria-expanded', String(!expanded));
    nav.classList.toggle('is-open');
  });
</script>
